[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "pawabot"
description = "My personal Telegram bot: aria2 management, torrent sites crawling, media organization with mvodb and Plex, etc."
authors = [{name = "Timothée Mazzucotelli", email = "dev@pawamoy.fr"}]
license = "ISC"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = []
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "aria2p>=0.9.1",
    "beautifulsoup4>=4.9.1",
    "httpx2>=0.1.0",
    "loguru>=0.5.2",
    "platformdirs>=4.0.0",
    "python-telegram-bot>=12.0.0b1",
    "sqlalchemy>=1.3.19",
    "tomlkit>=0.7.0",
]

[project.urls]
Homepage = "https://pawamoy.github.io/pawabot"
Documentation = "https://pawamoy.github.io/pawabot"
Changelog = "https://pawamoy.github.io/pawabot/changelog"
Repository = "https://github.com/pawamoy/pawabot"
Issues = "https://github.com/pawamoy/pawabot/issues"
Discussions = "https://github.com/pawamoy/pawabot/discussions"
Gitter = "https://gitter.im/pawabot/community"
Funding = "https://github.com/sponsors/pawamoy"

[project.scripts]
pawabot = "pawabot:main"

[tool.pdm.version]
source = "call"
getter = "scripts.get_version:get_version"

[tool.pdm.build]
# Include as much as possible in the source distribution, to help redistributors.
excludes = ["**/.pytest_cache"]
source-includes = [
    "config",
    "docs",
    "scripts",
    "share",
    "tests",
    "duties.py",
    "zensical.toml",
    "*.md",
    "LICENSE",
]

[tool.pdm.build.wheel-data]
# Manual pages can be included in the wheel.
# Depending on the installation tool, they will be accessible to users.
# pipx supports it, uv does not yet, see https://github.com/astral-sh/uv/issues/4731.
data = [
    {path = "share/**/*", relative-to = "."},
]

[dependency-groups]
maintain = [
    "git-changelog>=2.5",
    "twine>=5.1",
    "yore>=0.3.3",
]
ci = [
    "duty>=1.6",
    "griffe>=2.0",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "ruff>=0.4",
    "ty>=0.0.14",
    "types-markdown>=3.6",
    "types-pyyaml>=6.0",
]
docs = [
    "ghp-import>=2.1",
    "markdown-callouts>=0.4",
    "markdown-exec>=1.8",
    "mkdocstrings[python]>=0.29",
    # YORE: EOL 3.10: Remove line.
    "tomli>=2.0; python_version < '3.11'",
    "mkdocs>=1.1.2",
    "mkdocs-material>=5.5.12",
    "zensical>=0.0.21",
]

[tool.uv]
default-groups = ["maintain", "ci", "docs"]
